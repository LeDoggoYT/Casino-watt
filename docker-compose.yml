services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DATABASE_PATH: /app/data/watt-casino.sqlite
    volumes:
      - watt_casino_data:/app/data
    ports:
      - "127.0.0.1:3000:3000"

  # Caddy stellt die API über deine eigene Domain mit automatischem HTTPS bereit.
  # Für reines lokales Spielen ist dieser Dienst nicht nötig.
  caddy:
    image: caddy:2-alpine
    profiles: ["public"]
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - ./backend/.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  watt_casino_data:
  caddy_data:
  caddy_config:
