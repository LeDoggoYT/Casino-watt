<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Watt Casino – Verwaltung</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-page">
  <main class="admin-login" id="admin-login">
    <section class="admin-login-card" aria-labelledby="admin-login-title">
      <div class="auth-brand">
        <span class="brand-mark" aria-hidden="true"><span>W</span></span>
        <span class="brand-name">Watt <strong>Casino</strong></span>
      </div>
      <h1 id="admin-login-title">Admin-Zugang</h1>
      <p class="admin-form-message" id="admin-login-message" role="status" aria-live="polite"></p>
      <a class="admin-primary admin-back-link" href="../">Zum Casino</a>
    </section>
  </main>

  <div id="admin-app" hidden>
    <header class="admin-header">
      <div class="auth-brand">
        <span class="brand-mark" aria-hidden="true"><span>W</span></span>
        <span class="brand-name">Watt <strong>Casino</strong></span>
      </div>
      <span class="admin-title">Spielerverwaltung</span>
      <a class="admin-logout" href="../">Zum Casino</a>
    </header>

    <main class="admin-main">
      <section class="admin-panel" aria-labelledby="players-title">
        <header class="admin-panel-header">
          <div>
            <h1 id="players-title">Spieler</h1>
          </div>
          <form class="admin-search" id="admin-search-form" role="search">
            <label class="visually-hidden" for="admin-search">Spieler suchen</label>
            <input id="admin-search" name="search" type="search" maxlength="20" placeholder="Spieler suchen …" autocomplete="off">
            <button type="submit">Suchen</button>
          </form>
        </header>

        <div class="admin-notice" id="admin-notice" role="status" aria-live="polite"></div>
        <p class="admin-results" id="admin-results"></p>
        <div class="admin-player-list" id="admin-player-list"></div>
        <p class="admin-empty" id="admin-empty" hidden>Keine Spieler gefunden.</p>

        <footer class="admin-pagination">
          <button id="admin-prev" type="button">Zurück</button>
          <span id="admin-page-label">Seite 1 von 1</span>
          <button id="admin-next" type="button">Weiter</button>
        </footer>
      </section>
      <section class="admin-panel moderator-panel" id="moderator-panel" hidden aria-labelledby="moderators-title">
        <header class="admin-panel-header"><div><h2 id="moderators-title">Moderatoren</h2></div></header>
        <form id="moderator-form" class="moderator-form">
          <label for="moderator-search">Spieler auswählen</label>
          <input id="moderator-search" type="search" maxlength="20" placeholder="Mindestens 2 Buchstaben eingeben" autocomplete="off" aria-controls="moderator-search-results">
          <div id="moderator-search-results" class="moderator-search-results" role="listbox" hidden></div>
          <div id="moderator-selected" class="moderator-selected" hidden></div>
          <input id="moderator-username" name="username" type="hidden">
          <div class="moderator-permissions" id="moderator-permissions"></div>
          <button class="admin-primary" id="moderator-save" type="submit" disabled>Moderator speichern</button>
        </form>
        <div class="admin-notice" id="moderator-notice" role="status" aria-live="polite"></div>
        <div id="moderator-list" class="moderator-list"></div>
      </section>
    </main>
  </div>

  <script src="admin.js" defer></script>
</body>
</html>
